server:
  name: "bensyne"
  version: "1.0.0"
  transport: "streamable-http"
  host: "0.0.0.0"
  port: 3000

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  log_file: null

instance_pool:
  max_instances: 50
  eviction_timeout: 300
  data_dir: "/data"
  default_bank: "default"
