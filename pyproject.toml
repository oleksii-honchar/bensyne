[project]
name = "bensyne"
version = "1.1.0"
description = "Multi-tenant namespace-aware MCP server for mnemosyne-oss"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.4.7",
  "mnemosyne-memory[mcp]>=3.14.0,<4.0.0",
  "numpy>=1.26.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "starlette>=1.0.1,<2.0.0",
  "dependency-injector>=4.41.0,<5.0.0",
  "structlog>=23.0.0,<24.0.0",
  "uvicorn>=0.32.0,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "black>=24.10.0,<25.0.0",
  "flake8>=7.1.1,<8.0.0",
  "mypy>=1.14.1,<2.0.0",
  "alembic>=1.13.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "*/egg-info/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["src"]
