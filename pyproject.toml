[project]
name = "better-mnemosyne"
version = "1.0.0"
description = "Multi-tenant namespace-aware MCP server for mnemosyne-oss"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "starlette>=0.41.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "mnemosyne-memory[mcp]>=3.14.0,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "black>=24.10.0,<25.0.0",
    "flake8>=7.1.1,<8.0.0",
    "mypy>=1.14.1,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]

[tool.black]
line-length = 120
