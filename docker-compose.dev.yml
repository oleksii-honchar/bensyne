version: '3.8'

services:
  better-mnemosyne:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/data/mnemosyne/data
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=DEBUG
    command: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
