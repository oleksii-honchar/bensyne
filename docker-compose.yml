version: '3.8'

services:
  bensyne:
    image: tuiteraz/bensyne:latest
    ports:
      - "3000:3000"
    volumes:
      - /data/mnemosyne/data:/data/mnemosyne/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
