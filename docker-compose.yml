version: '3.8'

services:
  better-mnemosyne:
    image: tuteraz/better-mnemosyne:latest
    ports:
      - "3000:3000"
    volumes:
      - /data/mnemosyne/data:/data/mnemosyne/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
